name: Public site validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/check-metadata.mjs
      - run: git diff --exit-code -- docs/index.html
  browsers:
    uses: artandavoodi/artanrecords/.github/workflows/browser-regression.yml@a962934ed0b1308198c842325e7c7aa2b99877cb
    with:
      site: hub
      suite_ref: a962934ed0b1308198c842325e7c7aa2b99877cb
