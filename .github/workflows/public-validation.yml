name: Public site validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/check-metadata.mjs
      - run: git diff --exit-code -- docs/index.html
  browsers:
    uses: artandavoodi/artanrecords/.github/workflows/browser-regression.yml@337ad7624b4419f7e24f3b3cfb1215a167a958ad
    with:
      site: hub
      suite_ref: 337ad7624b4419f7e24f3b3cfb1215a167a958ad
